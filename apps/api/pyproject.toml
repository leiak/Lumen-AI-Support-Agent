[project]
name = "ai-customer-api"
version = "0.1.0"
description = "AI Customer Service API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "httpx>=0.27",
    "anthropic>=0.21",
    "openai>=1.30",
    "qdrant-client>=1.7",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "arq>=0.25",
    "ulid-py>=1.1.0",
    "bcrypt>=4.0,<5.0",
    "email-validator>=2.0",
    "pypdf>=6.18.0",
    "beautifulsoup4>=4.15.0",
    "python-multipart>=0.0.9",
    "langchain>=0.3",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "testcontainers[postgres,redis]>=4.7",
    "ruff>=0.4",
    "mypy>=1.10",
    "freezegun>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires real DB/Redis/Qdrant",
    "slow: slow tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"
explicit_package_bases = true

[dependency-groups]
dev = [
    "pytest-httpx>=0.36.2",
    "types-passlib>=1.7.7.20260211",
    "types-python-jose>=3.5.0.20260408",
]
