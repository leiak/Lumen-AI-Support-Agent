name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Backend Settings require these env vars to parse; unit tests run offline.
  DATABASE_URL: postgresql+asyncpg://aicustomer:aicustomer@localhost:5432/aicustomer
  REDIS_URL: redis://localhost:6379/0
  QDRANT_URL: http://localhost:6333
  JWT_SECRET: ci-only-secret-at-least-32-characters-long

jobs:
  backend:
    name: Backend (lint + type + unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Mypy type check
        run: mypy
      - name: Unit tests
        run: pytest -q -m "not integration" -p no:cacheprovider

  backend-integration:
    name: Backend (integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aicustomer
          POSTGRES_PASSWORD: aicustomer
          POSTGRES_DB: aicustomer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aicustomer"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.7.4
        ports: ["6333:6333"]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Integration tests
        run: pytest -q -m "integration" -p no:cacheprovider

  frontend:
    name: Agent workspace web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @lumen/web lint
      - name: Type check
        run: pnpm --filter @lumen/web type-check
      - name: Unit tests
        run: pnpm --filter @lumen/web test
      - name: Build
        run: pnpm --filter @lumen/web build

  web-sdk:
    name: Web Widget SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm --filter @lumen/web-sdk type-check
      - name: Unit tests
        run: pnpm --filter @lumen/web-sdk test
      - name: Build bundle
        run: pnpm --filter @lumen/web-sdk build
