name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Backend Settings require these env vars to parse; unit tests run offline.
  DATABASE_URL: postgresql+asyncpg://aicustomer:aicustomer@localhost:5432/aicustomer
  REDIS_URL: redis://localhost:6379/0
  QDRANT_URL: http://localhost:6333
  JWT_SECRET: ci-only-secret-at-least-32-characters-long

jobs:
  backend:
    name: Backend (lint + type + unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Mypy type check
        run: mypy
      - name: Unit tests
        run: pytest -q -m "not integration" -p no:cacheprovider

  backend-integration:
    name: Backend (integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aicustomer
          POSTGRES_PASSWORD: aicustomer
          POSTGRES_DB: aicustomer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aicustomer"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.7.4
        ports: ["6333:6333"]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Integration tests
        run: pytest -q -m "integration" -p no:cacheprovider

  frontend:
    name: Agent workspace web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @lumen/web lint
      - name: Type check
        run: pnpm --filter @lumen/web type-check
      - name: Unit tests
        run: pnpm --filter @lumen/web test
      - name: Build
        run: pnpm --filter @lumen/web build

  web-sdk:
    name: Web Widget SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm --filter @lumen/web-sdk type-check
      - name: Unit tests
        run: pnpm --filter @lumen/web-sdk test
      - name: Build bundle
        run: pnpm --filter @lumen/web-sdk build

  # Stage 11.7: smoke-test the container images end-to-end. Only runs
  # on push to main — PRs stay fast (DockerHub rate-limit + ~2 min
  # build savings per PR). The api smoke test curls ``/health/live``,
  # which deliberately has NO DB / Redis / Qdrant dependency
  # (Stage 11.4) so the image boots cleanly without the integration
  # service sidecars. The web smoke test is a static-file probe — no
  # SSR, no API call.
  docker-build:
    name: Docker image build smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build api image
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg SERVICE_VERSION=ci-${{ github.run_number }} \
            -t lumen-api:test \
            apps/api
      - name: Build web image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=http://localhost:8000 \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t lumen-web:test \
            apps/web
      - name: Smoke boot api (no deps)
        run: |
          # Run the API without postgres/redis/qdrant sidecars; the
          # container's lifespan hook tolerates Qdrant being down so
          # uvicorn reaches the listen state.
          docker run -d --name api-test --rm \
            -p 8000:8000 \
            -e ENVIRONMENT=development \
            -e DATABASE_URL=postgresql+asyncpg://x:x@127.0.0.1:9/x \
            -e REDIS_URL=redis://127.0.0.1:9/0 \
            -e QDRANT_URL=http://127.0.0.1:9 \
            -e JWT_SECRET=ci-only-secret-at-least-32-characters-long \
            -e DOUBAO_API_KEY=ci-only-key-not-real \
            lumen-api:test
          # Wait for the process to bind the port. ``curl --retry`` keeps
          # us from racing the uvicorn startup.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/live -o /dev/null; then
              echo "api: /health/live returned 200 after $i attempts"
              break
            fi
            sleep 1
          done
          # Assert 200 + the build metadata Stage 11.4 bakes in.
          curl -fsS http://localhost:8000/health/live | tee /tmp/api-live.json
          test "$(jq -r '.status' /tmp/api-live.json)" = "alive"
          test "$(jq -r '.git_sha' /tmp/api-live.json)" != "unknown"
          docker stop api-test
      - name: Smoke serve web
        run: |
          docker run -d --name web-test --rm \
            -p 8081:80 \
            lumen-web:test
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8081/ -o /dev/null; then
              echo "web: root returned 200 after $i attempts"
              break
            fi
            sleep 1
          done
          # nginx should serve the SPA shell. We don't assert the JS
          # bundle contents (that's the frontend job's responsibility).
          curl -fsS http://localhost:8081/ | grep -q '<div id="root"'
          docker stop web-test
