services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aicustomer
      POSTGRES_PASSWORD: aicustomer
      POSTGRES_DB: aicustomer
    ports:
      # Offset 25432 to avoid colliding with aitown-postgres-1 (127.0.0.1:5432)
      # when both are up; postgres inside the compose network still listens on 5432.
      - "25432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicustomer"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # Offset 26379 — lumen-platform-redis already uses 26380.
      - "26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.0
    ports:
      # Offset 26333 — qdrant is otherwise unbound; pick a stable non-default port.
      - "26333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  # Migration one-shot. Runs ``alembic upgrade head`` against the postgres
  # service. The api service below depends on this with
  # ``service_completed_successfully`` so uvicorn never comes up against
  # an un-migrated schema. The image is the same as api (the wheel
  # installs alembic), with volume mounts of src + alembic.ini +
  # migrations so the M1 Dockerfile import issue
  # (see memory: dockerfile-import-bug) is bypassed at runtime.
  migrate:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        SERVICE_VERSION: ${SERVICE_VERSION:-dev}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVICE_NAME: ai-customer-api
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
      GIT_SHA: ${GIT_SHA:-unknown}
      DATABASE_URL: postgresql+asyncpg://aicustomer:aicustomer@postgres:5432/aicustomer
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please}
      PYTHONPATH: /app/src
    volumes:
      # src — for absolute imports (``from core.config import ...``)
      - ../apps/api/src:/app/src:ro
      # alembic.ini + migrations — needed for `alembic upgrade head`
      # to find the script_location + version_path
      - ../apps/api/alembic.ini:/app/alembic.ini:ro
      - ../apps/api/migrations:/app/migrations:ro
    command:
      - sh
      - -c
      - "cd /app && alembic upgrade head"
    depends_on:
      postgres:
        condition: service_healthy

  # E2E seed one-shot. Runs the base tenant/users/channel seed
  # (tests/e2e/scripts/seed.py) followed by the Pack B budget/credit/
  # usage seed (tests/e2e/scripts/seed_budget.py), then the
  # example-integration FEISHU channel + KB + articles seed
  # (apps/example-integration/scripts/extend-seed.py) so the Feishu
  # webhook demo works out-of-the-box without needing bring-up.sh.
  # All three are idempotent — safe to re-run. Each script auto-locates
  # the repo root and anchors ``apps/api/src`` onto sys.path, so
  # mounting the repo root at /repo is enough.
  seed:
    # Reuse the api-built image (alembic + python deps + curl already present).
    image: aicustomer-api
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVICE_NAME: ai-customer-api
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
      GIT_SHA: ${GIT_SHA:-unknown}
      DATABASE_URL: postgresql+asyncpg://aicustomer:aicustomer@postgres:5432/aicustomer
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please}
      PYTHONPATH: /repo/apps/api/src
      # The demo tenant's LLM config seed reads these so the agent graph
      # can decrypt the BYOK row it inserts. Must match the api
      # service's TENANT_LLM_FERNET_KEY above. All optional — when
      # ANTHROPIC_API_KEY is unset the seed skips the row entirely.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      TENANT_LLM_FERNET_KEY: ${TENANT_LLM_FERNET_KEY:-nLJ6W1cj0isqEsiRqrg98WJ9EPVB7e-BM1ub1TIRO2Y=}
    volumes:
      - ../apps/api/src:/repo/apps/api/src:ro
      - ../tests/e2e/scripts:/repo/tests/e2e/scripts:ro
      - ../apps/example-integration/scripts:/repo/apps/example-integration/scripts:ro
    command:
      - sh
      - -c
      - "python -u /repo/tests/e2e/scripts/seed.py && python -u /repo/tests/e2e/scripts/seed_budget.py && python -u /repo/apps/example-integration/scripts/extend-seed.py"
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      args:
        # Stage 11.4: bake the host's git SHA into the image so /health
        # surfaces exactly which commit is running. Falls back to ``unknown``
        # when the operator builds outside a git checkout.
        GIT_SHA: ${GIT_SHA:-unknown}
        SERVICE_VERSION: ${SERVICE_VERSION:-dev}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVICE_NAME: ai-customer-api
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
      GIT_SHA: ${GIT_SHA:-unknown}
      DATABASE_URL: postgresql+asyncpg://aicustomer:aicustomer@postgres:5432/aicustomer
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please}
      WIDGET_ALLOWED_ORIGINS_GLOBAL: ${WIDGET_ALLOWED_ORIGINS_GLOBAL:-http://localhost:8080,http://localhost:8181}
      # Embedding model + Doubao (Volcengine Ark) credentials. Setting
      # DOUBAO_API_KEY routes the embedding client to DOUBAO_BASE_URL
      # instead of OpenAI. The vector size is resolved from
      # EMBEDDING_VECTOR_SIZES in knowledge/qdrant_client.py — changing
      # DEFAULT_EMBEDDING_MODEL to a different-dimension model requires
      # dropping the Qdrant collection (api container can recreate it
      # on next boot).
      DEFAULT_EMBEDDING_MODEL: ${DEFAULT_EMBEDDING_MODEL:-text-embedding-3-small}
      DOUBAO_API_KEY: ${DOUBAO_API_KEY:-}
      DOUBAO_BASE_URL: ${DOUBAO_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      # Anthropic-compatible LLM. When ANTHROPIC_BASE_URL is set the
      # provider is rerouted to a third-party Anthropic-format proxy
      # (e.g. Claude Code's MiniMax proxy). DEFAULT_LLM_MODEL can be any
      # model name the proxy accepts; the prefix resolver falls through
      # to the anthropic provider whenever the matching family isn't
      # locally registered (e.g. ``minimax-m3`` -> anthropic when only
      # ANTHROPIC_API_KEY is configured).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-claude-3-5-sonnet-20241022}
      # M4.C BYOK Fernet key. The api container reads this to decrypt
      # per-tenant LLM API keys in tenant_llm_configs; the ``seed``
      # one-shot reads the SAME key to encrypt the demo tenant's
      # row when extending the demo seed with an LLM config. Must be
      # a url-safe-base64 Fernet key (generate with ``Fernet.generate_key()``);
      # the dev value here matches DEMO_TENANT_LLM_FERNET_KEY in
      # apps/example-integration/scripts/extend-seed.py. Override in
      # production via .env — DO NOT ship the dev key.
      TENANT_LLM_FERNET_KEY: ${TENANT_LLM_FERNET_KEY:-nLJ6W1cj0isqEsiRqrg98WJ9EPVB7e-BM1ub1TIRO2Y=}
      # Multimodal KB (Stage 17): S3-compatible object store (MinIO in
      # dev, real AWS S3 in prod) + Doubao vision embedder credentials.
      # The api service depends on the ``minio`` container below; the
      # endpoint resolves to the compose-network hostname.
      OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:-http://minio:9000}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-lumen-kb}
      OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-minioadmin}
      OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-minioadmin}
      DOUBAO_VISION_API_KEY: ${DOUBAO_VISION_API_KEY:-}
      DOUBAO_VISION_BASE_URL: ${DOUBAO_VISION_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      DOUBAO_VISION_MODEL: ${DOUBAO_VISION_MODEL:-doubao-embedding-vision}
      PYTHONPATH: /app/src
    ports:
      - "8000:8000"
    volumes:
      - ../apps/api/src:/app/src:ro
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  # arq workers — long-running background job consumers.
  # The api process (uvicorn) only handles HTTP; async jobs (qa_judge,
  # history_mining on-demand) live in arq.WorkerSettings and need their
  # own process. Splitting them out keeps the web tier stateless and
  # matches the production deploy shape (separate worker pods in k8s).
  arq-qa:
    image: aicustomer-api
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVICE_NAME: ai-customer-api
      DATABASE_URL: postgresql+asyncpg://aicustomer:aicustomer@postgres:5432/aicustomer
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-claude-3-5-sonnet-20241022}
      # QA judge overrides: this env uses ANTHROPIC_API_KEY (pointing at
      # the minimax-anthropic endpoint) so the judge provider must be
      # 'anthropic'. Setting MINIMAX_API_KEY instead would register a
      # direct minimax provider and 'minimax' would resolve.
      QA_JUDGE_PROVIDER: ${QA_JUDGE_PROVIDER:-anthropic}
      QA_JUDGE_MODEL: ${QA_JUDGE_MODEL:-claude-3-5-sonnet-20241022}
      PYTHONPATH: /app/src
    volumes:
      - ../apps/api/src:/app/src:ro
    command: ["arq", "src.qa.worker.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  arq-history-mining:
    image: aicustomer-api
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVICE_NAME: ai-customer-api
      DATABASE_URL: postgresql+asyncpg://aicustomer:aicustomer@postgres:5432/aicustomer
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      DOUBAO_API_KEY: ${DOUBAO_API_KEY:-}
      DOUBAO_BASE_URL: ${DOUBAO_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      DOUBAO_EMBEDDING_MODEL: ${DOUBAO_EMBEDDING_MODEL:-doubao-embedding-large-text-240915}
      PYTHONPATH: /app/src
    volumes:
      - ../apps/api/src:/app/src:ro
    command: ["arq", "src.history_mining.worker.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        # Browser-side base URL: the SPA hits /api/v1/ which nginx
        # proxies to api:8000 inside the compose network (see
        # apps/web/nginx.conf). For external browser access (port
        # mapping 8080:80), this stays as localhost:8080.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  # MinIO: S3-compatible local object store for dev / demo.
  # The api container reads OBJECT_STORE_ENDPOINT pointing at
  # http://minio:9000 and uses MINIO_ROOT_USER / MINIO_ROOT_PASSWORD
  # as the access/secret keys. Production swaps this for real AWS S3
  # by overriding OBJECT_STORE_* env vars — no code change required.
  #
  # cleanstart/minio is a hardened drop-in replacement for minio/minio
  # (Docker Hub rate-limits the official image when pulling via certain
  # registries in CN). Runs as root because the named ``minio-data``
  # volume is created owned by root by default — without this, MinIO
  # fails at startup with "file access denied" on /data.
  minio:
    image: cleanstart/minio:latest
    user: "0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "29000:9000"
      - "29001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # cleanstart/minio ships wget (no curl, no bash) — use wget
      # to probe the standard MinIO liveness endpoint.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # M6.1 — OpenTelemetry tracing stack. The api + workers export
  # OTLP to otel-collector:4317; the collector batches and forwards
  # to Tempo. Open Tempo UI at http://localhost:33000.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.107.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      tempo:
        condition: service_started
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "33000:3100"   # Tempo UI + query API
    restart: unless-stopped

volumes:
  pgdata:
  qdrantdata:
  minio-data:
  tempo-data: